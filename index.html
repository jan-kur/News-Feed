<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Daily</title>
  <meta name="description" content="Personal daily AI news feed">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Daily">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>AI Daily</h1>
      <div class="top-actions">
        <label class="visually-hidden" for="day">Day</label>
        <select id="day" aria-label="Choose a day"></select>
        <button id="theme" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
      </div>
    </div>
    <div id="budget" class="budget" aria-live="polite"></div>
  </header>

  <main id="main">
    <p class="status" id="status">Loading…</p>
  </main>

  <footer class="foot">
    <span id="updated"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
