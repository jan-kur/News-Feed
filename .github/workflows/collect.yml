name: Collect raw items

# Optional. The daily Claude task runs the collector itself (prompts/daily-feed.md),
# so this workflow is not needed. It is kept for manual runs if GitHub Actions
# becomes available on the account. To run it daily, add back:
#   schedule:
#     - cron: "40 3 * * *"
on:
  workflow_dispatch:
    inputs:
      fire_task:
        description: "Start the Claude feed task when collection finishes"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: python scripts/collect.py

      - name: Commit raw data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/seen.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Raw items for $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 5))
            done
          fi
          echo "raw_file=$(ls -1 data/raw/*.json | sort | tail -n1)" >> "$GITHUB_OUTPUT"

      # Starts the Claude Code scheduled task through its API trigger.
      # Needs repo secrets CLAUDE_TASK_FIRE_URL and CLAUDE_TASK_TOKEN (see README).
      - name: Start Claude feed task
        if: github.event_name == 'schedule' || inputs.fire_task
        env:
          FIRE_URL: ${{ secrets.CLAUDE_TASK_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
          RAW_FILE: ${{ steps.commit.outputs.raw_file }}
        run: |
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then
            echo "::warning::CLAUDE_TASK_FIRE_URL / CLAUDE_TASK_TOKEN not set; the feed task will only run on its own schedule."
            exit 0
          fi
          body=$(jq -n --arg t "Raw items are committed in ${RAW_FILE} on branch ${GITHUB_REF_NAME} (workflow run ${GITHUB_RUN_ID})." '{text: $t}')
          for i in 1 2 3; do
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST "$FIRE_URL" \
              -H "Authorization: Bearer $FIRE_TOKEN" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "anthropic-version: 2023-06-01" \
              -H "Content-Type: application/json" \
              -d "$body") || code=000
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              echo "Feed task started: $(jq -r '.claude_code_session_url // empty' resp.json)"
              exit 0
            fi
            echo "Attempt $i failed with HTTP $code: $(head -c 300 resp.json 2>/dev/null)"
            sleep $((i * 20))
          done
          echo "::error::Could not start the Claude feed task. Its backup schedule will still run."
          exit 1
